<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Kaushik Holla</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563EB'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='Inter,system-ui,sans-serif' font-weight='700' font-size='14' fill='%23ffffff'%3EKH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #ffffff; --text: #16181d; --muted: #6b7280;
      --accent: #2563eb; --accent-strong: #1d4ed8; --line: #d7dae1; --surface: #fafbfc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0c0e; --text: #f3f4f6; --muted: #888e9a;
        --accent: #60a5fa; --accent-strong: #93c5fd; --line: rgba(255,255,255,0.17); --surface: #15181d; }
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
    }
    .code { font-size: clamp(3.5rem, 12vw, 6rem); font-weight: 700; letter-spacing: -0.05em; color: var(--accent); line-height: 1; margin-bottom: 14px; }
    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 1rem; margin-bottom: 30px; }
    a {
      display: inline-flex; align-items: center; gap: 8px;
      color: #fff; background: var(--accent);
      text-decoration: none; font-weight: 550; font-size: 0.92rem;
      padding: 11px 20px; border-radius: 10px;
      transition: background 0.18s ease;
    }
    a:hover { background: var(--accent-strong); }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">← Back to home</a>
  </div>
</body>
</html>
